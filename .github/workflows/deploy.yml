name: Fast Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v3
              with:
                  node-version: 18

            - uses: actions/cache@v3
              with:
                  path: |
                      ~/.npm
                      .next/cache
                  key:
                      ${{ runner.os }}-cache-${{
                      hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-cache-

            - name: Install deps
              run: npm ci

            - name: Build standalone
              run: npm run build

            - name: Verify standalone output
              run: |
                  echo "Checking standalone directory..."
                  ls -la .next/standalone/ || echo "Standalone folder not found!"

            - name: Package standalone
              run: |
                  mkdir -p deploy
                  cp -r .next/standalone/. deploy/
                  echo "Deploy folder contents:"
                  ls -la deploy/

            - name: Deploy to deployments branch
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"

                  git checkout --orphan deployments || git checkout deployments
                  git rm -rf . || true

                  cp -r deploy/. .

                  git add -A
                  git commit -m "Deploy $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
                  git push origin deployments --force
