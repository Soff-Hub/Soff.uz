name: Deploy Standalone Next.js

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v3
              with:
                  node-version: 18

            - name: Install deps
              run: npm install

            - name: Build Next.js standalone
              run: npm run build

            - name: Check standalone output
              run: ls -R .next/standalone

            - name: Prepare deployment folder
              run: |
                  mkdir -p deployment-folder
                  cp -r .next/standalone/* deployment-folder/

            - name: Deploy to deployments branch
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"

                  # Switch to deployments branch
                  git checkout deployments || git checkout -b deployments

                  # Clean branch
                  git rm -rf . || true
                  git clean -fd

                  # Copy new build
                  cp -r $GITHUB_WORKSPACE/deployment-folder/* .

                  git add .
                  git commit -m "Deploy standalone build" || echo "No changes"
                  git push origin deployments --force
