name: Deploy Standalone Next.js

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: 18

            - name: Install dependencies
              run: npm install

            - name: Build Next.js standalone
              run: npm run build

            # Debug to confirm standalone folder exists
            - name: Debug standalone folder
              run: ls -R .next/standalone

            # Prepare deployment folder
            - name: Copy standalone build
              run: |
                  rm -rf deployment-folder
                  mkdir deployment-folder

                  cp -r .next/standalone/* deployment-folder/

            - name: Deploy to deployments branch
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"

                  git checkout deployments || git checkout -b deployments

                  rm -rf ./*
                  cp -r ../deployment-folder/* .

                  git add .
                  git commit -m "Deploy standalone build" || echo "Nothing to commit"
                  git push origin deployments --force
