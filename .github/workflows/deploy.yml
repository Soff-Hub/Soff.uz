name: Fast Deploy

on:
    push:
        branches: [main]

# Prevent concurrent deployments
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1 # Shallow clone - only need latest commit

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: 'npm' # Built-in npm caching

            - name: Install dependencies
              run: npm ci --prefer-offline --no-audit --no-fund

            - name: Cache Next.js build
              uses: actions/cache@v4
              with:
                  path: |
                      .next/cache
                  key:
                      ${{ runner.os }}-nextjs-${{
                      hashFiles('**/package-lock.json') }}-${{
                      hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

            - name: Build application
              run: npm run build

            - name: Prepare deployment
              run: |
                  mkdir -p deploy
                  cp -r .next/standalone/. deploy/
                  echo "✅ Deployment package ready ($(du -sh deploy | cut -f1))"

            - name: Deploy to branch
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  # Fetch only the deployments branch if it exists
                  git fetch origin deployments:deployments 2>/dev/null || git checkout --orphan deployments

                  # Switch to deployments branch
                  git checkout deployments 2>/dev/null || true

                  # Remove all files except .git and deploy folder
                  find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'deploy' -exec rm -rf {} +

                  # Move deployment files to root
                  mv deploy/* deploy/.[!.]* . 2>/dev/null || mv deploy/* .
                  rmdir deploy

                  # Commit and push
                  git add -A

                  if git diff --staged --quiet; then
                      echo "ℹ️  No changes to deploy"
                      exit 0
                  fi

                  COMMIT_MSG="Deploy: $(date +'%Y-%m-%d %H:%M:%S') [$(echo ${{ github.sha }} | cut -c1-7)]"
                  git commit -m "$COMMIT_MSG"
                  git push origin deployments --force-with-lease

                  echo "✅ Deployed successfully!"
